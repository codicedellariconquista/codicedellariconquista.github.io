  <link rel="stylesheet" href="../assets/css/fonts.css" />

  <style>
    html, body {
      margin: 0;
      background: hsl(30 20% 95%);
      color: #120d0d;
      font: 17px/1.65 Roboto, Arial, sans-serif;
    }
    body { min-height: 100%; }
    .grazie-wrap { max-width: 28rem; margin: 0 auto; padding: 8px 20px 48px; }
    .grazie-brand a { color: inherit; text-decoration: none; }
    .grazie {
      text-align: center;
      margin-top: 2.2rem;
    }
    .grazie h1 {
      font: 700 1.85rem/1.2 "STIX Two Text", Georgia, serif;
      margin: 0 0 .5rem;
    }
    .grazie .lead {
      margin: 0 0 1.6rem;
      font: 400 1.08rem/1.45 Roboto, Arial, sans-serif;
      color: #120d0d;
    }
    .grazie-btn {
      display: block;
      box-sizing: border-box;
      width: 100%;
      padding: 16px 24px;
      border-radius: 6px;
      background: hsl(120 70% 35%);
      color: #fff;
      font: 800 1.15rem/1.3 Inter, Arial, sans-serif;
      text-align: center;
      text-decoration: none;
      box-shadow: 3px 3px 3px #0000004d;
      transition: background-color .2s ease-in-out;
    }
    .grazie-btn:hover,
    .grazie-btn:focus-visible {
      background: hsl(120 70% 28%);
      color: #fff;
    }
    .grazie .note {
      margin: 1.5rem 0 0;
      color: #4a4541;
      font-size: .95rem;
      line-height: 1.55;
    }
    .grazie-foot {
      margin-top: 2.8rem;
      padding-top: 1.2rem;
      border-top: 1px solid #d9d0c7;
      text-align: center;
      color: #4a4541;
      font-size: .92rem;
    }
    .grazie-foot p { margin: 0 0 .6rem; }
    .grazie-foot nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .4rem 1.2rem;
    }
    .grazie-foot a { color: inherit; text-decoration: underline; }
    .grazie-foot a:hover { opacity: .75; }
  </style>
</head>
<body>
  <div class="grazie-wrap">
    <header class="grazie-brand">
      <a href="/" aria-label="Il Codice della Riconquista">
        <div class="rq-brand" role="img" aria-label="Il Codice della Riconquista"><span class="rq-brand-small">IL CODICE DELLA <span aria-hidden="true">🌹</span></span> RICONQUISTA <span class="rq-brand-rule" aria-hidden="true"></span></div>
      </a>
    </header>
    <main class="grazie">
      <h1>Pagamento confermato</h1>
      <p class="lead">Il tuo accesso è pronto.</p>
      <a class="grazie-btn" href="/leggi/">Apri il tuo accesso</a>
      <p class="note">L'accesso ti arriva anche via email, all'indirizzo usato per l'acquisto. Se non vedi l'email, controlla spam e Promozioni.</p>
    </main>
    <footer class="grazie-foot">
      <p>© 2026 Il Codice della Riconquista</p>
      <nav>
        <a href="/termini/">termini d'uso</a>
        <a href="/privacy/">informativa sulla privacy</a>
      </nav>
    </footer>
  </div>
</body>

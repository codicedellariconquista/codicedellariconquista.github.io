(function(){var C=window.RQ_CONFIG,qs=new URLSearchParams(location.search);function getCookie(n){var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}function setCookie(n,v){try{document.cookie=n+"="+encodeURIComponent(v)+"; max-age="+C.VARIANT_DAYS*86400+"; path=/; SameSite=Lax"}catch(e){}}function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}function ok(v){v=(v||"").toUpperCase();return v==="A"||v==="B"?v:null}function rnd(){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}var forced=ok(qs.get(C.VARIANT_PARAM));var v=forced||ok(getCookie(C.VARIANT_KEY))||ok(ls(C.VARIANT_KEY));if(!v)v=rnd()<C.SPLIT_A?"A":"B";setCookie(C.VARIANT_KEY,v);ls(C.VARIANT_KEY,v);qs.set(C.VARIANT_PARAM,v);var q=qs.toString();location.replace((v==="A"?C.PATH_A:C.PATH_B)+(q?"?"+q:"")+location.hash)})();
